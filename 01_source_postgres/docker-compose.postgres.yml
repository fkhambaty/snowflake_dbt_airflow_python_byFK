services:
  postgres:
    image: postgres:16
    container_name: meridian_postgres
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    command:
      # wal_level=logical is not needed for our watermark CDC, but it lets you demo
      # logical replication / Debezium as the "production grade" alternative.
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "track_io_timing=on"           # EXPLAIN (ANALYZE, BUFFERS) shows real I/O time
    volumes:
      - meridian_pgdata:/var/lib/postgresql/data

volumes:
  meridian_pgdata:
