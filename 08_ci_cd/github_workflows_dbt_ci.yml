# Explained copy only. The executable source of truth is
# .github/workflows/meridian-dbt-ci.yml at the repository root.
#
# "Slim CI": on every pull request, build ONLY the models that changed (and everything
# downstream of them) into a throw-away schema, run their tests, then drop the schema.
# `--defer --state` lets unchanged upstream models be read from PRODUCTION instead of
# being rebuilt, which is what makes CI finish in minutes instead of hours.
name: dbt CI

on:
  pull_request:
    paths:
      - "04_dbt_meridian_dw/**"

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/04_dbt_meridian_dw
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_DBT_USER: MERIDIAN_DBT_SVC
  SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/dbt_key.p8
  CI_SCHEMA: dbt_ci_pr_${{ github.event.number }}

jobs:
  slim-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_dbt_meridian_dw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install "dbt-core>=1.10" "dbt-snowflake>=1.9" sqlfluff sqlfluff-templater-dbt

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_DBT_PRIVATE_KEY }}" > "$SNOWFLAKE_PRIVATE_KEY_PATH"

      - name: Fetch production manifest (state for slim CI)
        run: |
          mkdir -p prod-state
          python ../02_ingestion_python/dbt_artifact.py download prod-state

      - name: dbt deps
        run: dbt deps

      - name: Lint SQL
        run: sqlfluff lint models/intermediate/int_account_primary_holder.sql --dialect snowflake --templater jinja

      - name: Build changed models + downstream into the CI schema
        run: |
          cp profiles.yml.example profiles.yml
          if [ -f prod-state/manifest.json ]; then
            dbt build --select state:modified+ --defer --state prod-state --target dev --vars "{dev_days_of_history: 7}"
          else
            dbt build --target dev --vars "{dev_days_of_history: 7}"
          fi
        env:
          DBT_SCHEMA: ${{ env.CI_SCHEMA }}

      - name: Drop CI schemas
        if: always()
        run: |
          dbt run-operation drop_ci_schemas --args "{prefix: ${{ env.CI_SCHEMA }}}" --target dev || true
